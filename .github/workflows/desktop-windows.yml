name: MSAS Desktop 1.0.0 candidate
on:
  push:
    branches: ['desktop-build/msas-1.0.0']
    paths: ['scripts/build_desktop_windows.py', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline regression
        run: python scripts/qa_gate.py --require-node
      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 pywebview==6.1
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile native engine, verify parity, package and smoke-test
        run: python scripts/build_desktop_windows.py
      - name: Upload candidate only after build gates pass
        uses: actions/upload-artifact@v4
        with:
          name: MSAS_1.0.0_Windows_x64
          path: desktop-release/
          if-no-files-found: error
          retention-days: 7
